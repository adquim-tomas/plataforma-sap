# Pipeline de build + deploy del frontend (Vite/React) a Azure Static Web Apps.
# Requiere el variable group "swa-secrets" con AZURE_STATIC_WEB_APPS_API_TOKEN.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/*

pool:
  vmImage: ubuntu-latest

variables:
  - group: azure-static-web-apps-blue-tree-01660d90f-variable-group

steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Instalar Node 20'

  - script: |
      npm install -g bun
      cd frontend
      bun install
    displayName: 'Instalar dependencias (bun)'

  - script: |
      cd frontend
      bun run build
    displayName: 'Build de producción (tsc + vite build)'
    env:
      # Vite inyecta esto en build-time dentro del bundle — debe apuntar al
      # backend real en App Service, no a localhost.
      VITE_API_URL: 'https://app-plataforma-sap-api.azurewebsites.net'

  - task: AzureStaticWebApp@0
    inputs:
      app_location: 'frontend/dist'
      output_location: ''
      skip_app_build: true
      azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_TREE_01660D90F)'
    displayName: 'Deploy a Azure Static Web Apps'