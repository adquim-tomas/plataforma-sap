[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# Techos de versión acotados al siguiente major para evitar que un upgrade
# automático con cambios incompatibles entre al lockfile sin revisión.
dependencies = [
    "alembic>=1.18.4,<2",
    "fastapi>=0.136.0,<1",
    "httpx>=0.28.1,<1",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.0.2,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "psycopg2-binary>=2.9.12,<3",
    "pydantic-settings>=2.14.0,<3",
    "python-jose>=3.5.0,<4",
    "python-multipart>=0.0.26,<1",
    "sqlalchemy>=2.0.49,<3",
    "uvicorn>=0.45.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]
