services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adquim
      POSTGRES_PASSWORD: adquim
      POSTGRES_DB: adquim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adquim -d adquim_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app  # hot reload en dev
      - backend_venv:/app/.venv  # entorno virtual Linux aislado del host
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install -g bun && bun install && bun run dev --host 0.0.0.0 --port 5173"

volumes:
  postgres_data:
  backend_venv: